[project]
name = "lektyra"
version = "0.0.1"
description = "Live or recorded speech to transcript, speakers, known voices and checkable statements."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Martin Fric" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
  "numpy>=2.1",
  "onnxruntime>=1.20",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "typer>=0.15",
  "uvicorn>=0.32",
]

[project.scripts]
lektyra = "lektyra.cli:app"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.13",
  "playwright>=1.65.2",
  "pytest>=8.3",
  "ruff>=0.8",
]
voice = [
    "speechbrain>=1.0",
    "torch>=2.4",
    "torchaudio>=2.4",
]

[tool.uv]
# The spike needs speaker embeddings (torch + SpeechBrain, CPU) on every machine that runs it.
default-groups = ["dev", "voice"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lektyra"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "T20", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Slovak text and typographic quotes in strings/docs are intended

[tool.ruff.lint.per-file-ignores]
"src/lektyra/cli.py" = ["T20"]  # the CLI is the one place that prints (ADR-001)
"scripts/**" = ["T20"]  # command-line helpers print their answers

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Untyped third-party libraries: allowed only inside src/lektyra/adapters/ (ADR-001).
module = ["onnxruntime", "onnxruntime.*", "speechbrain", "speechbrain.*", "torchaudio", "torchaudio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs Postgres, ffmpeg or the network"]
addopts = "-ra --strict-markers"
